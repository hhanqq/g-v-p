# База знаний по устранению — раздел 5/20 п.6 ("рекомендации по устранению
# проблемы на основе базы знаний"). Общие, проверяемые шаги эксплуатации
# для каждого symptom_class, которые знает любой дежурный инженер уровня
# L1/L2 — это НЕ база инцидентов конкретного предприятия (её у нас нет и
# быть не может на синтетических данных, раздел 18.8), а типовой чек-лист
# первичной диагностики. LLM в Go delivery planner только выбирает и
# формулирует релевантные пункты под конкретный инцидент — сами шаги
# берутся отсюда дословно, а не выдумываются моделью (раздел 13).

host_unreachable:
  - Проверить физическую связность (порт коммутатора, кабель, статус линка).
  - Проверить доступность соседних узлов той же подсети — массовость укажет на сетевой сегмент, а не на конкретный хост.
  - Проверить журнал последних изменений конфигурации сети/файрвола на этом сегменте.

node_down:
  - Проверить питание и статус интерфейсов коммутатора локально (если есть физический доступ) или через соседний узел управления.
  - Проверить, не запланированы ли работы на этом узле (плановое окно, раздел 6.3).
  - Эскалировать на сетевую группу — от узла зависит доступность нижестоящих объектов (раздел 6, топологическая ось).

interface_down:
  - Проверить статус конкретного порта/интерфейса на устройстве.
  - Проверить кабель и трансивер, если интерфейс физический.
  - Сверить с последними изменениями VLAN/конфигурации порта.

disk_space:
  - Проверить крупные лог-файлы и временные каталоги — типовая причина резкого роста.
  - Проверить, не идёт ли аномально быстрый рост (утечка/зависший процесс) или это плавное исчерпание.
  - Спланировать расширение тома, если рост объективный и продолжится за порог.

service_down:
  - Проверить статус процесса/службы и её последний код завершения.
  - Проверить журнал последних деплоев/обновлений на этом узле — частая причина.
  - Проверить зависимые сервисы (раздел 4.2 — сервис может зависеть от нескольких объектов).

power_lost:
  - Проверить ИБП/PDU на площадке и статус ввода электропитания.
  - Для буровой установки — сверить с нарядом на работы (плановое отключение) до эскалации.
  - При отсутствии планового окна — немедленная эскалация дежурному инженеру площадки (раздел 18.4, сценарий P0).
