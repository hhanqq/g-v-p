# Тестовый LDAP-каталог (glauth) — раздел «Безопасность» кейса:
# "реализована авторизация через LDAP/AD". Реальной корпоративной AD у
# синтетической компании нет и быть не может (раздел 18.8 — все данные
# фиктивны), поэтому здесь развёрнут настоящий LDAP-сервер по протоколу
# (не имитация в коде) с синтетическими пользователями/группами — те же
# запросы (bind, поиск группы), что были бы к реальному LDAP/AD.
#
# Пароли — demo-пароли для стенда, не для продакшена (см. память проекта
# — весь сервер тестовый/одноразовый).

[ldap]
  enabled = true
  listen = "0.0.0.0:389"

[ldaps]
  enabled = false

[backend]
  datastore = "config"
  baseDN = "dc=gpn-dispatcher,dc=local"

# --- Группы (роли) --------------------------------------------------------
[[groups]]
  name = "admins"
  gidnumber = 5501

[[groups]]
  name = "employees"
  gidnumber = 5502

# --- Пользователи ----------------------------------------------------------
