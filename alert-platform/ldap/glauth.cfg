  givenname = "Тестовый"
  sn = "Получатель Второй"
  mail = "tester2@gpn-dispatcher.local"
  uidnumber = 6005
  primarygroup = 5502
  passsha256 = "91b4d142823f7d20c5f08df69122de43f35f057a988d9619f6d3138485c9a203"

# svc-search — служебная учётная запись приложения: только для проверки
# членства в группе (bind end-пользователя проверяет только пароль,
# членство в группе ищет отдельный сервисный bind — стандартная практика
# для LDAP/AD-интеграций, не только для этого демо-стенда).
[[users]]
  name = "svc-search"
  uidnumber = 6099
  primarygroup = 5502
  # Раньше хеш соответствовал захардкоженному в коде дефолту "svc123"
  # (реальный пароль на проде — код нигде не переопределял его через
  # LDAP_SEARCH_PASSWORD). Ротирован; актуальное значение — только в
  # .env машины, не в репозитории (тот же принцип, что и SESSION_SECRET).
  passsha256 = "bb255a59a0423b74cc01d4fd9fa453e53b7a4145011352cb557b5207c1807829"
  [[users.capabilities]]
    action = "search"
    object = "*"

# noc1 — ещё один обычный сотрудник; используется в демо "увольнения":
# удалите этот блок и перезапустите glauth, чтобы смоделировать
# увольнение — деактивация подписок подхватит это на следующей сверке.
