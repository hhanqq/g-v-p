# Тестовый LDAP-каталог (glauth) — раздел «Безопасность» кейса:
# "реализована авторизация через LDAP/AD". Реальной корпоративной AD у
# синтетической компании нет и быть не может (раздел 18.8 — все данные
# фиктивны), поэтому здесь развёрнут настоящий LDAP-сервер по протоколу
# (не имитация в коде) с синтетическими пользователями/группами — те же
# запросы (bind, поиск группы), что были бы к реальному LDAP/AD.
#
# Пароли — demo-пароли для стенда, не для продакшена (см. память проекта
# — весь сервер тестовый/одноразовый).

[ldap]
  enabled = true
  listen = "0.0.0.0:389"

[ldaps]
  enabled = false

[backend]
  datastore = "config"
  baseDN = "dc=gpn-dispatcher,dc=local"

# --- Группы (роли) --------------------------------------------------------
[[groups]]
  name = "admins"
  gidnumber = 5501

[[groups]]
  name = "employees"
  gidnumber = 5502

# --- Пользователи ----------------------------------------------------------
# admin1 — администратор платформы (доступ к /dashboard и /sources)
[[users]]
  name = "admin1"
  givenname = "Администратор"
  sn = "Платформы"
  mail = "admin1@gpn-dispatcher.local"
  uidnumber = 6001
  primarygroup = 5501
  passsha256 = "240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9"

# engineer1 — обычный сотрудник (НЕ в группе admins — админ-раздел закрыт)
[[users]]
  name = "engineer1"
  givenname = "Инженер"
  sn = "Дежурный"
  mail = "engineer1@gpn-dispatcher.local"
  uidnumber = 6002
  primarygroup = 5502
  passsha256 = "80ca306ac6e68366dd0a26125c9647e0c61fac6668cec6016f5fe30fb12e99bd"

# tester — тот же TrueConf-логин, что использует бот для тестовой
# доставки (TRUECONF_TEST_RECIPIENT) — раздел «Безопасность»: автоотключение
# при увольнении (packages/common/deprovision.py) сверяет РЕАЛЬНЫХ
# подписчиков платформы с каталогом, поэтому тестовый получатель тоже
# должен быть зарегистрированным сотрудником, а не только TrueConf-аккаунтом.
[[users]]
  name = "tester"
  givenname = "Тестовый"
  sn = "Получатель"
  mail = "tester@gpn-dispatcher.local"
  uidnumber = 6004
  primarygroup = 5502
  passsha256 = "854ddc006369eb7bac38bb6690e7f9b05d0d68659be1f96564df407d653e0df2"

# tester2 — второй тестовый TrueConf-получатель (заведён пользователем
# 2026-08-07 специально для демонстрации разной маршрутизации разным
# людям) — та же причина, что и у tester выше: должен быть в LDAP, иначе
# автоотключение при увольнении деактивирует его на первой же сверке.
[[users]]
  name = "tester2"
  givenname = "Тестовый"
  sn = "Получатель Второй"
  mail = "tester2@gpn-dispatcher.local"
  uidnumber = 6005
  primarygroup = 5502
  passsha256 = "91b4d142823f7d20c5f08df69122de43f35f057a988d9619f6d3138485c9a203"

# svc-search — служебная учётная запись приложения: только для проверки
# членства в группе (bind end-пользователя проверяет только пароль,
# членство в группе ищет отдельный сервисный bind — стандартная практика
# для LDAP/AD-интеграций, не только для этого демо-стенда).
[[users]]
  name = "svc-search"
  uidnumber = 6099
  primarygroup = 5502
  passsha256 = "45cdd0d48c1d78bd22f1d02f3267003590841a8999db837736bcbd292991b62d"
  [[users.capabilities]]
    action = "search"
    object = "*"

