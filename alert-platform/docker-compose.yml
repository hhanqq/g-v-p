services:
  ldap:
    # Раздел «Безопасность» кейса: "реализована авторизация через LDAP/AD".
    # glauth — настоящий сервер по LDAP-протоколу (bind, поиск группы), а
    # не имитация в коде; конфиг — ldap/glauth.cfg (синтетические
    # пользователи/группы, т.к. реальной корпоративной AD у синтетической
    # компании нет и быть не может, раздел 18.8).
    image: glauth/glauth:latest
    volumes:
      - ./ldap/glauth.cfg:/app/config/config.cfg:ro
    # Порт нужен только сервисам внутри compose (они ходят по DNS-имени
    # "ldap" в docker-сети) — публиковать наружу незачем, это лишняя
    # поверхность атаки на каталог пользователей.
    ports: ["127.0.0.1:3893:389"]

  postgres:
    # pgvector/pgvector:pg16 — официальный drop-in для postgres:16 с
    # добавленным расширением vector (kb_chunks, RAG по базе знаний,
    # см. 0009_knowledge_base.sql). Тот же pgdata-volume, пересоздание
    # контейнера не требует миграции данных.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: alert
      POSTGRES_PASSWORD: alert
      POSTGRES_DB: alert_platform
    # Порт параметризован: 5433 часто уже занят локальной БД другого
    # проекта; внутри compose адрес всегда postgres:5432. Биндим на
    # 127.0.0.1 — только для локальной отладки (psql/docker exec на самой
    # машине), без публикации всей БД в интернет с паролем по умолчанию.
    ports: ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alert"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: python -u -m scripts.migrate
    environment:
      DATABASE_URL: postgresql://alert:alert@postgres:5432/alert_platform
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  kb-index:
    # Одноразовая индексация knowledge_base/*.md в kb_chunks (RAG для
    # ИИ-разбора алерта по запросу). Запускается вручную:
    # docker compose run --rm kb-index — не часть постоянного рантайма.
    build:
      context: .
      dockerfile: go-platform/Dockerfile
    entrypoint: ["/usr/local/bin/kb-index"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://alert:alert@postgres:5432/alert_platform
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_EMBED_MODEL: nomic-embed-text
      KB_DIR: /app/knowledge_base
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  gateway:
    # Первая перенесённая на Go стадия. HTTP-контракт совместим с
    # FastAPI-шлюзом, а Signal + SignalQueueEntry пишутся атомарно.
    build:
      context: .
      dockerfile: go-platform/Dockerfile
    # Хост-порт 8081, а не 8080 — 8080 на этой машине уже занят внутренним
    # httpd TrueConf Server (webmanager backend).
    ports: ["8081:8080"]
    environment:
      DATABASE_URL: postgresql://alert:alert@postgres:5432/alert_platform
    depends_on:
      migrate:
        condition: service_completed_successfully

  pipeline-worker:
    build:
      context: .
      dockerfile: go-platform/Dockerfile
    entrypoint: ["/usr/local/bin/pipeline-worker"]
    # pipeline-worker (в отличие от delivery-trueconf) остаётся на мостовой
    # docker-сети — ему нужно имя "postgres". Go-клиент локальной LLM
    # ходит в Ollama на ХОСТЕ, а
    # 127.0.0.1 внутри моста — это сам контейнер, не хост. host-gateway
    # (Docker 20.10+) даёт добраться до хоста, не переключая всю сеть
    # контейнера на host (не хотим терять DNS-имя "postgres").
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://alert:alert@postgres:5432/alert_platform
      OLLAMA_URL: http://host.docker.internal:11434
      CONNECTORS_DIR: /app/connectors
      PRIORITY_MATRIX_PATH: /app/priority_matrix.yaml
      PIPELINE_POLL_INTERVAL_S: "1"
      TTL_SWEEP_EVERY_S: "30"
      PIPELINE_STUCK_TIMEOUT_S: "120"
    depends_on:
      migrate:
        condition: service_completed_successfully

  deprovision-worker:
    # LDAP-сверка отделена от доменного pipeline: недоступность каталога
    # не влияет на обработку событий, а увольнение всё ещё автоматически
    # деактивирует подписки и пишет audit_log.
    build: .
    command: python -u -m services.deprovision.main
    environment:
      DATABASE_URL: postgresql+psycopg2://alert:alert@postgres:5432/alert_platform
      LDAP_URL: ldap://ldap:389
      LDAP_BASE_DN: dc=gpn-dispatcher,dc=local
      LDAP_SEARCH_USER: ${LDAP_SEARCH_USER:-svc-search}
      LDAP_SEARCH_PASSWORD: ${LDAP_SEARCH_PASSWORD:-svc123}
      DEPROVISION_INTERVAL_S: "30"
      PYTHONUNBUFFERED: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
      ldap:
        condition: service_started

  demo-runner:
    # Изолированный синтетический datagen/AI self-test. Он не обслуживает
    # HTML, авторизацию или admin API и не участвует в production-тракте.
    build: .
    command: uvicorn services.demo.main:app --host 0.0.0.0 --port 8091
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+psycopg2://alert:alert@postgres:5432/alert_platform
      OLLAMA_URL: http://host.docker.internal:11434
      CMDB_SEED: "42"
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin-console:
    # Go владеет SPA, LDAP session, личным кабинетом и admin API. Только
    # синтетический datagen/AI self-test уходит в изолированный runner.
    build:
      context: .
      dockerfile: go-platform/Admin.Dockerfile
    ports: ["8090:8090"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://alert:alert@postgres:5432/alert_platform
      DEMO_RUNNER_URL: http://demo-runner:8091
      WEB_DIST_DIR: /app/web
      PORT: "8090"
      LDAP_URL: ldap://ldap:389
      LDAP_BASE_DN: dc=gpn-dispatcher,dc=local
      LDAP_SEARCH_USER: ${LDAP_SEARCH_USER:-svc-search}
      LDAP_SEARCH_PASSWORD: ${LDAP_SEARCH_PASSWORD:-svc123}
      SESSION_SECRET: ${SESSION_SECRET:-dispatcher-demo-secret}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CLICKHOUSE_URL: clickhouse://alert:${CLICKHOUSE_PASSWORD:-alert}@clickhouse:9000/alerting
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-log-reader}
    depends_on:
      migrate:
        condition: service_completed_successfully
      demo-runner:
        condition: service_started
      ldap:
        condition: service_started
      clickhouse-migrate:
        condition: service_completed_successfully

  delivery-planner:
    build:
      context: .
      dockerfile: go-platform/Dockerfile
    entrypoint: ["/usr/local/bin/delivery-planner"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://alert:alert@postgres:5432/alert_platform
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_EMBED_MODEL: nomic-embed-text
      RUNBOOKS_PATH: /app/runbooks.yaml
      DELIVERY_POLL_INTERVAL_S: "5"
      PYTHONUNBUFFERED: "1"
      TRUECONF_TEST_RECIPIENT: ${TRUECONF_TEST_RECIPIENT:-}
      TRUECONF_PUBLIC_CONSOLE_URL: ${TRUECONF_PUBLIC_CONSOLE_URL:-http://localhost:8090}
    depends_on:
      migrate:
        condition: service_completed_successfully

  delivery-trueconf:
    build: .
    command: python -u -m services.delivery_trueconf.adapter
    # network_mode: host — бот и TrueConf Server теперь на одной машине;
    # так бот стучится на 127.0.0.1:4309 (заведомо "локальный" адрес для
    # security-зон tc_bridge, раздел 20 п.11) вместо публичного IP, и не
    # нужно поддерживать Trusted-network-зону под адрес контейнера.
    network_mode: host
    environment:
      DATABASE_URL: ${DELIVERY_DATABASE_URL:-postgresql+psycopg2://alert:alert@postgres:5432/alert_platform}
      DELIVERY_POLL_INTERVAL_S: "5"
      PYTHONUNBUFFERED: "1"
      TRUECONF_SERVER: ${TRUECONF_SERVER:-}
      TRUECONF_BOT_USERNAME: ${TRUECONF_BOT_USERNAME:-}
      TRUECONF_BOT_PASSWORD: ${TRUECONF_BOT_PASSWORD:-}
      TRUECONF_TEST_RECIPIENT: ${TRUECONF_TEST_RECIPIENT:-}
      TRUECONF_PUBLIC_CONSOLE_URL: ${TRUECONF_PUBLIC_CONSOLE_URL:-http://localhost:8090}
      DELIVERY_MAX_ATTEMPTS: "8"
      DELIVERY_STUCK_TIMEOUT_S: "120"
    depends_on:
      migrate:
        condition: service_completed_successfully

  redpanda:
    # Kafka-wire-совместимая шина для потока change_events (история
    # изменений объектов/сотрудников/групп/источников). Один узел,
    # без ZooKeeper/JVM — тот же протокол и Go-клиент, что у "настоящего"
    # Kafka, но не создаёт избыточной инфраструктурной нагрузки при
    # реальном объёме кейса (~0.06 событий/с). НЕ встаёт между шлюзом и
    # pipeline-worker'ом — тот остаётся на Postgres+FOR UPDATE SKIP
    # LOCKED, самом измеренном и продемонстрированном пути платформы.
    image: redpandadata/redpanda:v24.3.13
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=768M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    ports: ["127.0.0.1:19092:19092"]
    volumes:
      - redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  clickhouse:
    # Аналитическое хранилище change_events для low-code поиска
    # (раздел «История изменений»). Postgres остаётся источником правды
    # для операционного состояния и для истории на карточках объекта/
    # сотрудника (быстрый прямой запрос, не зависящий от ClickHouse) —
    # ClickHouse используется только для кросс-сущностного поиска.
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: alert
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-alert}
      CLICKHOUSE_DB: alerting
    ports: ["127.0.0.1:8123:8123", "127.0.0.1:9010:9000"]
    volumes:
      - clickhousedata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  clickhouse-migrate:
    # Одноразовое применение database/clickhouse_migrations/*.sql — тот
    # же паттерн, что migrate/kb-index (docker compose run --rm или
    # автоматически на up, restart: "no"). ClickHouse — аналитический
    # сток для low-code поиска, не операционный источник правды.
    build:
      context: .
      dockerfile: go-platform/Dockerfile
    entrypoint: ["/usr/local/bin/clickhouse-migrate"]
    environment:
      CLICKHOUSE_URL: clickhouse://alert:${CLICKHOUSE_PASSWORD:-alert}@clickhouse:9000/alerting
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: "no"

  minio:
    # Data Lake для сырого архива Signal (раздел «История изменений»,
    # опциональная фаза 5) — долгосрочное хранение/переобработка/ML/RAG
    # поверх уже существующего WORM-журнала signals, не замена ему.
    # S3-совместимо, open-source, без внешнего облака — тот же принцип,
    # что у остального стека.
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-alert}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-alert12345}
    ports: ["127.0.0.1:9002:9000", "127.0.0.1:9003:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  changelog-worker:
    # Postgres.change_events -> Redpanda -> ClickHouse, плюс (опционально,
    # если задан MINIO_ENDPOINT) вотермарк-tailer Signal -> MinIO. Строго
    # побочный контур: никогда не встаёт между шлюзом и pipeline-worker'ом,
    # отставание/недоступность любой части не влияет на приём событий или
    # доставку — см. живую проверку в SECURITY.md/INFRASTRUCTURE.md.
    build:
      context: .
      dockerfile: go-platform/Dockerfile
    entrypoint: ["/usr/local/bin/changelog-worker"]
    environment:
      DATABASE_URL: postgresql://alert:alert@postgres:5432/alert_platform
      KAFKA_BROKERS: redpanda:9092
      CLICKHOUSE_URL: clickhouse://alert:${CLICKHOUSE_PASSWORD:-alert}@clickhouse:9000/alerting
      CHANGELOG_POLL_INTERVAL_S: "2"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-alert}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-alert12345}
      MINIO_BUCKET: dispatcher-datalake
      DATALAKE_POLL_INTERVAL_S: "5"
    depends_on:
      migrate:
        condition: service_completed_successfully
      clickhouse-migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  redpandadata:
  clickhousedata:
  miniodata:
